[project]
name = "finnect-backend"
version = "0.1.0"
description = "FIN:NECT backend — FastAPI + SQLAlchemy 2.0 (async) + local OpenAI-compatible LLM"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",          # 로컬/CI 용 SQLite 폴백
    "greenlet>=3.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-jose[cryptography]>=3.3",   # 익명 세션 JWT
    "tenacity>=9.0",            # 429/503 백오프
    "httpx>=0.27",
    "apscheduler>=3.10",        # 정책 상품 주기 동기화 (data_collector)
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]
# 펀드 조사 정합화 스크립트(scripts/ingest_surveys.py 등)에서만 쓰는 무거운 의존성
data = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pyarrow>=17.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]   # FastAPI 의 Depends() 기본값 패턴 허용

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
